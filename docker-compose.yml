services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: riskguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  service:
    build:
      context: .
      target: service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: "postgres://postgres:postgres@postgres:5432/riskguard?sslmode=disable"
      RISK_THRESHOLD: "50"

  simulator:
    build:
      context: .
      target: simulator
    depends_on:
      kafka:
        condition: service_healthy
      service:
        condition: service_started
    environment:
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC: "payments.transactions"
    command: ["--interval=500ms", "--anomaly-every=6"]

volumes:
  pgdata: