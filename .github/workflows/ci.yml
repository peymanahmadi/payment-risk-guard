name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -cover

      - name: Upload coverage
        run: go test ./... -coverprofile=coverage.out
      
      - name: Show coverage
        run: go tool cover -func=coverage.out

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build service image
        run: docker build --target service -t payment-risk-guard-service .

      - name: Build simulator image
        run: docker build --target simulator -t payment-risk-guard-simulator .